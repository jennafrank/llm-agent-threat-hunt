<svg width="100%" viewBox="0 0 700 230" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Hunt 24 — TideGlass: Autonomous LLM-Agent Post-Exploitation</title>
  <desc>Animated banner for the TideGlass threat hunt repo. Network-flow design with coral and mint palette matching Jenna Frank's GitHub branding.</desc>

  <defs>
    <clipPath id="clip">
      <rect x="0" y="0" width="700" height="230" rx="12"/>
    </clipPath>
    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#FF6B9D" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <!-- Gradient for the timeline bar -->
    <linearGradient id="timelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF6B9D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF4444" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Glow for nodes -->
    <radialGradient id="nodeGlow">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow">
      <stop offset="0%" stop-color="#7FFFD4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7FFFD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="alertGlow">
      <stop offset="0%" stop-color="#FF4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF4444" stop-opacity="0"/>
    </radialGradient>
    <!-- Sweep gradient for animated radar -->
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FFFD4" stop-opacity="0"/>
      <stop offset="80%" stop-color="#7FFFD4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7FFFD4" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="230" rx="12" fill="#0D0D12"/>

  <!-- Scanline overlay -->
  <rect x="0" y="0" width="700" height="230" fill="url(#scanlines)" clip-path="url(#clip)"/>

  <!-- Animated vertical sweep -->
  <rect x="-200" y="0" width="200" height="230" fill="url(#sweepGrad)" clip-path="url(#clip)">
    <animate attributeName="x" values="-200;700" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ Network topology backbone ═══ -->
  <!-- Left cluster: the notebook server -->
  <g opacity="0.5">
    <!-- Hub ring -->
    <circle cx="68" cy="115" r="22" fill="none" stroke="#FF6B9D" stroke-width="0.8" stroke-dasharray="3,3"/>
    <circle cx="68" cy="115" r="22" fill="none" stroke="#FF6B9D" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4">
      <animate attributeName="r" values="22;28;22" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Spokes -->
    <line x1="46" y1="100" x2="30" y2="80" stroke="#FF6B9D" stroke-width="0.4" opacity="0.3"/>
    <line x1="46" y1="130" x2="28" y2="150" stroke="#FF6B9D" stroke-width="0.4" opacity="0.3"/>
    <line x1="90" y1="100" x2="100" y2="78" stroke="#FF6B9D" stroke-width="0.4" opacity="0.3"/>
    <line x1="90" y1="130" x2="102" y2="155" stroke="#FF6B9D" stroke-width="0.4" opacity="0.3"/>
    <!-- Leaf nodes -->
    <circle cx="30" cy="80" r="2" fill="#FF6B9D" opacity="0.5"/>
    <circle cx="28" cy="150" r="2" fill="#FF6B9D" opacity="0.5"/>
    <circle cx="100" cy="78" r="2" fill="#FF6B9D" opacity="0.4"/>
    <circle cx="102" cy="155" r="2" fill="#FF6B9D" opacity="0.4"/>
  </g>

  <!-- Right cluster: the exfil endpoint -->
  <g opacity="0.5">
    <circle cx="632" cy="115" r="22" fill="none" stroke="#FF4444" stroke-width="0.8" stroke-dasharray="3,3"/>
    <circle cx="632" cy="115" r="22" fill="none" stroke="#FF4444" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4">
      <animate attributeName="r" values="22;28;22" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <line x1="654" y1="100" x2="670" y2="78" stroke="#FF4444" stroke-width="0.4" opacity="0.3"/>
    <line x1="654" y1="130" x2="672" y2="155" stroke="#FF4444" stroke-width="0.4" opacity="0.3"/>
    <line x1="610" y1="100" x2="598" y2="78" stroke="#FF4444" stroke-width="0.4" opacity="0.3"/>
    <line x1="610" y1="130" x2="598" y2="155" stroke="#FF4444" stroke-width="0.4" opacity="0.3"/>
    <circle cx="670" cy="78" r="2" fill="#FF4444" opacity="0.5"/>
    <circle cx="672" cy="155" r="2" fill="#FF4444" opacity="0.5"/>
    <circle cx="598" cy="78" r="2" fill="#FF4444" opacity="0.4"/>
    <circle cx="598" cy="155" r="2" fill="#FF4444" opacity="0.4"/>
  </g>

  <!-- ═══ Top section ═══ -->
  <!-- Terminal prompt -->
  <text x="30" y="28" font-family="'Courier New', Courier, monospace" font-size="11" fill="#7FFFD4" opacity="0.5">analyst@sentinel:~$ hunt --id 24 --name tideglass</text>
  <!-- Blinking cursor -->
  <rect x="390" y="18" width="7" height="13" rx="1" fill="#7FFFD4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- CVE tag top-right -->
  <text x="540" y="28" font-family="'Courier New', Courier, monospace" font-size="10" fill="#FF4444" opacity="0.6">CVE-2026-39987</text>

  <!-- Pulsing alert dot -->
  <circle cx="530" cy="24" r="3" fill="#FF4444" opacity="0.6">
    <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Thin separator -->
  <line x1="30" y1="38" x2="670" y2="38" stroke="#FF6B9D" stroke-width="0.5" opacity="0.25"/>

  <!-- ═══ Title ═══ -->
  <text x="350" y="82"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="44"
    font-weight="700"
    letter-spacing="4"
    fill="#FFE4F0">TIDEGLASS</text>

  <!-- Mint underline accent -->
  <line x1="175" y1="90" x2="525" y2="90" stroke="#7FFFD4" stroke-width="1.5" opacity="0.35"/>

  <!-- Subtitle -->
  <text x="350" y="112"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    letter-spacing="5"
    fill="#7FFFD4"
    opacity="0.85">AUTONOMOUS LLM-AGENT POST-EXPLOITATION</text>

  <!-- ═══ Attack timeline bar ═══ -->
  <!-- Timeline track -->
  <rect x="110" y="135" width="480" height="3" rx="1.5" fill="#1A1520"/>
  <!-- Filled progress -->
  <rect x="110" y="135" width="480" height="3" rx="1.5" fill="url(#timelineGrad)" opacity="0.6"/>

  <!-- Timeline nodes — the 6 kill chain stages -->
  <!-- Node 1: RCE -->
  <circle cx="130" cy="136" r="8" fill="url(#nodeGlow)"/>
  <circle cx="130" cy="136" r="4" fill="#0D0D12" stroke="#FF6B9D" stroke-width="1.5"/>
  <circle cx="130" cy="136" r="2" fill="#FF6B9D"/>
  <text x="130" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FF6B9D" opacity="0.7">RCE</text>

  <!-- Node 2: IMDS -->
  <circle cx="210" cy="136" r="8" fill="url(#nodeGlow)"/>
  <circle cx="210" cy="136" r="4" fill="#0D0D12" stroke="#FF6B9D" stroke-width="1.5"/>
  <circle cx="210" cy="136" r="2" fill="#FF6B9D"/>
  <text x="210" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FF6B9D" opacity="0.7">IMDS</text>

  <!-- Node 3: SECRETS -->
  <circle cx="310" cy="136" r="8" fill="url(#nodeGlow)"/>
  <circle cx="310" cy="136" r="4" fill="#0D0D12" stroke="#FF6B9D" stroke-width="1.5"/>
  <circle cx="310" cy="136" r="2" fill="#FF6B9D"/>
  <text x="310" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FF6B9D" opacity="0.7">SECRETS</text>

  <!-- Node 4: SSH -->
  <circle cx="410" cy="136" r="8" fill="url(#nodeGlow)"/>
  <circle cx="410" cy="136" r="4" fill="#0D0D12" stroke="#FF6B9D" stroke-width="1.5"/>
  <circle cx="410" cy="136" r="2" fill="#FF6B9D"/>
  <text x="410" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FF6B9D" opacity="0.7">SSH</text>

  <!-- Node 5: DUMP -->
  <circle cx="490" cy="136" r="8" fill="url(#nodeGlow)"/>
  <circle cx="490" cy="136" r="4" fill="#0D0D12" stroke="#FF6B9D" stroke-width="1.5"/>
  <circle cx="490" cy="136" r="2" fill="#FF6B9D"/>
  <text x="490" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FF6B9D" opacity="0.7">DUMP</text>

  <!-- Node 6: EXFIL (red — the bad ending) -->
  <circle cx="570" cy="136" r="10" fill="url(#alertGlow)"/>
  <circle cx="570" cy="136" r="4" fill="#0D0D12" stroke="#FF4444" stroke-width="1.5"/>
  <circle cx="570" cy="136" r="2" fill="#FF4444"/>
  <text x="570" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#FF4444" opacity="0.8">EXFIL</text>

  <!-- Animated packet traveling the timeline -->
  <circle r="3" fill="#FF6B9D" opacity="0">
    <animateMotion dur="3.5s" repeatCount="indefinite">
      <mpath href="#attackPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <path id="attackPath" d="M130,136 L570,136" fill="none" stroke="none"/>

  <!-- Second packet, offset -->
  <circle r="2" fill="#7FFFD4" opacity="0">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="1.8s">
      <mpath href="#attackPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0.7;0" dur="3.5s" repeatCount="indefinite" begin="1.8s"/>
  </circle>

  <!-- ═══ Stats row ═══ -->
  <text x="130" y="188"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#FFD700"
    opacity="0.85">96/100</text>
  <text x="130" y="199"
    font-family="'Courier New', Courier, monospace"
    font-size="8"
    fill="#FFD700"
    opacity="0.5">SCORE</text>

  <text x="250" y="188"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#FF6B9D"
    opacity="0.7">10 findings</text>
  <text x="250" y="199"
    font-family="'Courier New', Courier, monospace"
    font-size="8"
    fill="#FF6B9D"
    opacity="0.4">ATT&amp;CK MAPPED</text>

  <text x="390" y="188"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#FF6B9D"
    opacity="0.7">9 detections</text>
  <text x="390" y="199"
    font-family="'Courier New', Courier, monospace"
    font-size="8"
    fill="#FF6B9D"
    opacity="0.4">KQL RULES</text>

  <text x="530" y="188"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#FF6B9D"
    opacity="0.7">52 min</text>
  <text x="530" y="199"
    font-family="'Courier New', Courier, monospace"
    font-size="8"
    fill="#FF6B9D"
    opacity="0.4">FULL CHAIN</text>

  <!-- Bottom separator -->
  <line x1="30" y1="210" x2="670" y2="210" stroke="#7FFFD4" stroke-width="0.5" opacity="0.2"/>

  <!-- Bottom labels -->
  <text x="30" y="224" font-family="'Courier New', monospace" font-size="9" fill="#7FFFD4" opacity="0.4">HUNT 24  //  1ST OF 39  //  THREAT HUNT REPORT</text>
  <text x="510" y="224" font-family="'Courier New', monospace" font-size="9" fill="#FF6B9D" opacity="0.4">jenna frank // 2026</text>

</svg>
